[package]
name = "moebius"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
moebius-core = { version = "0.1.0", path = "../moebius-core" }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "signal"] }

[lints]
workspace = true

[dev-dependencies]
axum = "0.8.9"
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "time"] }
