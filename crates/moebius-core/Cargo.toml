[package]
name = "moebius-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
moebius-plugin-api = { path = "../moebius-plugin-api" }
hex = "0.4.3"
regex = "1.13.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.0"
thiserror = "2.0.21"
toml = "1.1.8"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
axum = { version = "0.8.9", features = ["ws"] }
getrandom = "0.3"
mlua = { version = "0.11.6", features = ["luau"] }
reqwest = { version = "0.13.5", features = ["json", "stream"] }
futures-util = "0.3.34"

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
tokio-tungstenite = "0.30.0"
