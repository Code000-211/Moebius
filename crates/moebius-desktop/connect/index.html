<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Moebius</title>
    <link rel="stylesheet" href="connect.css" />
    <script src="connect.js" defer></script>
  </head>
  <body class="ground">
    <!-- The window has no system frame: its controls lie on the ground, and the strip moves the window. -->
    <div class="window-bar" data-tauri-drag-region>
      <button type="button" data-window="minimize" aria-label="Minimize">&#x2013;</button>
      <button type="button" data-window="toggleMaximize" aria-label="Maximize">&#x25a1;</button>
      <button type="button" data-window="close" aria-label="Close">&#x2715;</button>
    </div>
    <main>
      <section class="sheet" id="local" hidden>
        <h1>A server on this machine</h1>
        <p class="hint" id="local-hint"></p>
        <p class="hint" id="local-working" hidden>Working: the first start downloads the program, which can take a minute.</p>
        <p class="error" id="local-error" role="alert" hidden></p>
        <label class="stay"><input type="checkbox" id="local-stay" checked /> Stay signed in</label>
        <button type="button" class="primary" id="local-start"></button>
      </section>
      <form class="sheet" id="connect">
        <h1>Connect to a server</h1>
        <p class="hint">An address and an access token of yours, from My tokens or <code>moebius login</code>.</p>
        <label>Address <input name="address" placeholder="127.0.0.1:7171" autocomplete="url" required /></label>
        <label>Access token <input name="token" type="password" autocomplete="off" required /></label>
        <label class="stay"><input type="checkbox" name="stay" id="connect-stay" checked /> Stay signed in</label>
        <p class="error" id="error" role="alert" hidden></p>
        <button type="submit" class="primary" id="connect-submit">Connect</button>
      </form>
      <!-- The servers the app remembers, when it could not open one at its start (they may be down). -->
      <section class="sheet" id="saved" hidden>
        <h1>Your servers</h1>
        <ul id="saved-list"></ul>
      </section>
    </main>
  </body>
</html>
