[package]
name = "moebius-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
iced = { version = "0.14", features = ["tokio", "svg", "highlighter"] }
dirs = "6"
futures-util = "0.3.34"
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["time"] }
tokio-tungstenite = "0.30.0"
toml = "1.1.8"

[dev-dependencies]
iced_test = "0.14"
moebius-core = { path = "../moebius-core" }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net"] }

[lints]
workspace = true
