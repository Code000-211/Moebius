name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # The Pi-Bolt release the end-to-end test runs against.
  PIBOLT_VERSION: bolt-v1.0.5

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Pi-Bolt's installer checks the release's signature and checksums before it installs anything.
      - name: Install Pi-Bolt for the end-to-end test
        run: |
          curl -fsSL "https://raw.githubusercontent.com/opensec-git/Pi-Bolt/$PIBOLT_VERSION/install.sh" \
            | PIBOLT_YES=1 PIBOLT_EXTENSIONS=no sh
          echo "MOEBIUS_PI_BOLT=$HOME/.local/bin/pi-bolt" >> "$GITHUB_ENV"
      - run: cargo test --workspace
      # A render test that fails keeps what it drew; keep it with the run.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-diffs
          path: target/snapshot-diffs
          if-no-files-found: ignore
      - run: cargo run -p moebius-plugin-api --example allow_reads
      - run: cargo run -p moebius-plugin-api --example allow_reads_process

  # The desktop app, the command line and the plugin API build and pass their tests on Windows, and so do the server's
  # tests that need no Unix program (the others are `#[cfg(unix)]`, each saying why). The server is documented and
  # tested on Linux and WSL 2; on Windows it builds and starts.
  windows:
    runs-on: windows-latest
    env:
      # aws-lc-sys uses its prebuilt NASM objects on Windows, which has no NASM.
      AWS_LC_SYS_PREBUILT_NASM: 1
    steps:
      # The tests read the documentation and the scripts as they are committed, with LF line ends.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace
      - run: cargo test -p moebius-desktop -p moebius -p moebius-plugin-api
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-diffs-windows
          path: target/snapshot-diffs
          if-no-files-found: ignore
      - run: cargo test -p moebius-core

  # The code builds with the Rust version that `rust-version` in Cargo.toml names, and that is the version the README
  # tells people to install.
  msrv:
    runs-on: ubuntu-latest
    env:
      # Older compilers do not warn about the same things as the current one.
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v4
      - name: Read rust-version
        run: echo "MSRV=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.MSRV }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets
