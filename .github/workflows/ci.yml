name: CI

# A branch is built by its pull request; a push builds only main, so a push to a branch with a pull request does not
# run the whole workflow twice.
on:
  push:
    branches: [main]
  pull_request:

# A newer push to a pull request cancels the run it supersedes, so the queue holds only runs that count. A run of main
# is not cancelled once it started, so every commit on main gets its verdict.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # The Pi-Bolt release the end-to-end test runs against.
  PIBOLT_VERSION: bolt-v1.0.5

jobs:
  # What the pull request changes decides which of the jobs below run, so a change to the web app does not wait for the
  # Rust jobs, nor a change to a page of the documentation for the bundles of the desktop app. A job that does not run is
  # reported as skipped, which counts as passing for a protected branch. A push to main runs every job.
  #
  # Every job runs when `.github/`, `Cargo.toml`, `Cargo.lock` or a `rust-toolchain` file changes, and so does a run
  # whose list of changed files cannot be read. Otherwise a job runs when a path it builds or tests changes:
  #
  #   rust     (check, windows, msrv)  `crates/`, `examples/` and `docs/`, which the tests of moebius-core read (the
  #            reference, the guide, the links, the module map, the examples) and the built-in skill embeds; every
  #            `*.md` in the repository, which the test of links reads; and the three files of `web/` that the crates
  #            read: `web/csp.json`, `web/src/api/fixtures/` and `web/src/desktop/`. The end-to-end test of the server
  #            and the plugin examples are part of `check`. The column scripts are in `crates/moebius-core/kanban/`.
  #   web      `web/`, `docs/design-web.md` (the test of the tokens reads it), and `crates/` and `examples/`, because the
  #            last step of the job builds `moebius` and runs the end-to-end tests against it.
  #   desktop  `crates/` and `web/`: the app is built from the crates and embeds `web/dist`.
  #
  # A path that matches none of these (`docs/design/` pictures and mockups, `dist/`, `LICENSE`, `NOTICE`) changes
  # nothing a test reads; the Markdown beside them is covered by `rust`. When a test starts to read a new place, add it
  # here.
  changes:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.paths.outputs.rust }}
      web: ${{ steps.paths.outputs.web }}
      desktop: ${{ steps.paths.outputs.desktop }}
    steps:
      # The commit of a pull request's run is the merge of its head into the base; its first parent is the base.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: paths
        env:
          EVENT: ${{ github.event_name }}
        run: |
          all=false
          files=""
          if [ "$EVENT" != pull_request ]; then
            all=true
          elif ! changed=$(git diff --name-only --no-renames HEAD^1 HEAD) || [ -z "$changed" ]; then
            all=true
          elif echo "$changed" | grep -qE '^(\.github/|Cargo\.toml$|Cargo\.lock$|rust-toolchain)'; then
            all=true
          else
            # A picture or mockup under docs/design changes nothing a test reads, unless it is deleted: a page can link to it.
            quiet='^docs/design(-drafts)?/'
            {
              echo "$changed" | grep -vE "$quiet" || true
              echo "$changed" | grep -E "$quiet" | grep -E '\.md$' || true
              git diff --name-only --no-renames --diff-filter=D HEAD^1 HEAD | grep -E "$quiet" || true
            } > "$RUNNER_TEMP/files"
            files=$(cat "$RUNNER_TEMP/files")
          fi
          # Whether any changed file matches the pattern; true for every job when `all` is.
          any() {
            if [ "$all" = true ] || echo "$files" | grep -qE "$1"; then echo true; else echo false; fi
          }
          {
            echo "rust=$(any '^(crates/|examples/|docs/|web/csp\.json$|web/src/api/fixtures/|web/src/desktop/)|\.md$')"
            echo "web=$(any '^(web/|docs/design-web\.md$|crates/|examples/)')"
            echo "desktop=$(any '^(crates/|web/)')"
          } | tee -a "$GITHUB_OUTPUT"
          echo "$files"

  check:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The runner image's own Node changes with the image; a test reads the Pi extension with it, so pin it as the web job does.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # The desktop app (Tauri) draws with WebKitGTK.
      - name: Install what the desktop app builds with
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Pi-Bolt's installer checks the release's signature and checksums before it installs anything.
      - name: Install Pi-Bolt for the end-to-end test
        run: |
          curl -fsSL "https://raw.githubusercontent.com/opensec-git/Pi-Bolt/$PIBOLT_VERSION/install.sh" \
            | PIBOLT_YES=1 PIBOLT_EXTENSIONS=no sh
          echo "MOEBIUS_PI_BOLT=$HOME/.local/bin/pi-bolt" >> "$GITHUB_ENV"
      - run: cargo test --workspace
      - run: cargo run -p moebius-plugin-api --example allow_reads
      - run: cargo run -p moebius-plugin-api --example allow_reads_process
      - run: cargo run -p moebius-plugin-api --example wrap_launcher
      - run: cargo run -p moebius-plugin-api --example wrap_launcher_process

  # The command line and the plugin API build and pass their tests on Windows, and so do the server's
  # tests that need no Unix program (the others are `#[cfg(unix)]`, each saying why). The server is documented and
  # tested on Linux and WSL 2; on Windows it builds and starts.
  windows:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: windows-latest
    env:
      # aws-lc-sys uses its prebuilt NASM objects on Windows, which has no NASM.
      AWS_LC_SYS_PREBUILT_NASM: 1
    steps:
      # The tests read the documentation and the scripts as they are committed, with LF line ends.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace
      - run: cargo test -p moebius -p moebius-plugin-api -p moebius-desktop
      - run: cargo test -p moebius-core --no-fail-fast

  # The code builds with the Rust version that `rust-version` in Cargo.toml names, and that is the version the README
  # tells people to install.
  msrv:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    env:
      # Older compilers do not warn about the same things as the current one.
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v4
      - name: Read rust-version
        run: echo "MSRV=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.MSRV }}
      - uses: Swatinem/rust-cache@v2
      - name: Install what the desktop app builds with
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev
      - run: cargo check --workspace --all-targets

  # The desktop app's bundles, as the release makes them: the AppImage and the `.deb` on Linux, the installer on
  # Windows. The Linux bundles are built on the oldest Ubuntu the release uses, so they run on the systems of today.
  desktop:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, bundles: "appimage,deb" }
          - { os: windows-latest, bundles: nsis }
    runs-on: ${{ matrix.os }}
    env:
      AWS_LC_SYS_PREBUILT_NASM: 1
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop
      - if: runner.os == 'Linux'
        name: Install what the desktop app builds with
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      # The app embeds the web app from web/dist.
      - run: pnpm -C web install --frozen-lockfile && pnpm -C web build
      - name: Build the bundles
        working-directory: crates/moebius-desktop
        run: pnpm dlx @tauri-apps/cli@2.12.4 build --debug --bundles ${{ matrix.bundles }} -- --locked
      - run: ls target/debug/bundle/*/
      # What the guide promises a person on Linux: the `.deb` installs and the app starts, and so does the AppImage. A
      # start that is still running when `timeout` ends it (status 124) has not crashed; the session has a bus and no
      # tray host, as a minimal desktop has. The runner has the build's WebKitGTK libraries already, so this does not
      # show that the `.deb` names every library it needs; it shows that the bundles start.
      - if: runner.os == 'Linux'
        name: Install the .deb and start both bundles
        run: |
          sudo apt-get install -y xvfb dbus-x11 ./target/debug/bundle/deb/*.deb
          set +e
          xvfb-run -a dbus-run-session -- timeout 20 moebius-desktop
          test $? -eq 124 || { echo "the installed app did not stay up"; exit 1; }
          appimage=$(echo target/debug/bundle/appimage/*.AppImage)
          chmod +x "$appimage"
          APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run -a dbus-run-session -- timeout 30 "$appimage"
          test $? -eq 124 || { echo "the AppImage did not stay up"; exit 1; }

  # The web app (`web/`): type check, lint, unit tests and the build on Linux and Windows. The end-to-end tests run on
  # Linux only: Playwright's Chromium is installed there with its system libraries in one step.
  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: web
    steps:
      # The formatter checks line ends: LF, as committed.
      # Before the checkout web/ does not exist yet, so this step runs in the workspace.
      - run: git config --global core.autocrlf false
        working-directory: .
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - if: runner.os == 'Linux'
        run: pnpm exec playwright install --with-deps chromium
      - if: runner.os == 'Linux'
        run: pnpm e2e
      # The design audit, strict: what is always wrong (overflow, clipped text, words below their row, state pills) fails.
      - if: runner.os == 'Linux'
        run: pnpm audit:design
        env:
          MOEBIUS_DESIGN_STRICT: "1"
      # Once more against a real server that embeds the build, so the two cannot drift apart.
      - if: runner.os == 'Linux'
        uses: dtolnay/rust-toolchain@stable
      - if: runner.os == 'Linux'
        uses: Swatinem/rust-cache@v2
        with:
          key: web-e2e
      - if: runner.os == 'Linux'
        run: cargo build -p moebius
        working-directory: .
      - if: runner.os == 'Linux'
        run: pnpm e2e
        env:
          MOEBIUS_E2E_SERVER: ${{ github.workspace }}/target/debug/moebius
